mode: ContinuousDeployment

next-version: 1.0.0

strategies:
  - ConfiguredNextVersion
  - Mainline
  - Fallback

branches:
  main:
    regex: ^main$
    increment: Patch
    is-main-branch: true
    label: ""

  feature:
    regex: ^features?[/-]
    increment: Minor

  hotfix:
    regex: ^hotfix[/-]
    increment: Patch
